services:
  - type: web
    name: descargas-app
    runtime: node
    plan: starter            # el disco persistente requiere plan de pago
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false          # Render te pedirá el valor al crear el servicio
      - key: DATA_DIR
        value: /var/data
      - key: MAX_FILE_MB
        value: "500"
    disk:
      name: apps
      mountPath: /var/data
      sizeGB: 5
